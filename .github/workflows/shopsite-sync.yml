name: ShopSite Sync

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to sync'
        required: false
        type: choice
        options:
          - all
          - products
          - orders
        default: all
      limit:
        description: 'Maximum number of items to sync (applies to both if target is "all")'
        required: false
        type: string
        default: ''
      start_date:
        description: 'Start date for order sync (mm/dd/yyyy)'
        required: false
        type: string
      sync_run_id:
        description: 'Sync run ID from trigger API for correlation'
        required: false
        type: string
        default: ''

concurrency:
  group: shopsite-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ShopSite Data
    environment: register-sync
    runs-on: [self-hosted, Windows, X64, register-sync]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
        env:
          CI: true

      - name: Run syncs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPSITE_URL: ${{ secrets.SHOPSITE_URL }}
          SHOPSITE_MERCHANT_ID: ${{ secrets.SHOPSITE_MERCHANT_ID }}
          SHOPSITE_PASSWORD: ${{ secrets.SHOPSITE_PASSWORD }}
        run: |
          $target = "${{ github.event.inputs.target }}"
          if ([string]::IsNullOrWhiteSpace($target)) {
            $target = "all"
          }

          $limitArgs = @()
          if ("${{ github.event.inputs.limit }}" -ne "") {
            $limitArgs += "--limit=${{ github.event.inputs.limit }}"
          }

          $orderArgs = @($limitArgs)
          if ("${{ github.event.inputs.start_date }}" -ne "") {
            $orderArgs += "--start-date=${{ github.event.inputs.start_date }}"
          }

          $success = $true

          if ($target -eq "all" -or $target -eq "products") {
            Write-Host "=== Syncing ShopSite Products ==="
            try {
              $syncRunArg = if ("${{ github.event.inputs.sync_run_id }}" -ne "") { @("--sync-run-id=${{ github.event.inputs.sync_run_id }}") } else { @() }
              & bun run sync:shopsite @limitArgs @syncRunArg
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::Product sync failed with exit code $LASTEXITCODE"
                $success = $false
              }
            } catch {
              Write-Host "::error::Product sync threw an exception: $_"
              $success = $false
            }
          }

          if ($target -eq "all" -or $target -eq "orders") {
            Write-Host "=== Syncing ShopSite Orders ==="
            try {
              $syncRunArg = if ("${{ github.event.inputs.sync_run_id }}" -ne "") { @("--sync-run-id=${{ github.event.inputs.sync_run_id }}") } else { @() }
              & bun run sync:orders @orderArgs @syncRunArg
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::Order sync failed with exit code $LASTEXITCODE"
                $success = $false
              }
            } catch {
              Write-Host "::error::Order sync threw an exception: $_"
              $success = $false
            }
          }

          if (-not $success) {
            exit 1
          }
