schema_version: "1.0"
name: bentleyseeds
display_name: Bentley Seeds
base_url: https://bentleyseeds.com
scraper_type: static
use_stealth: true

selectors:
  - name: search_result_link
    selector: "a[href*='/products/']"
    fallback_selectors:
      - "a[href*='/products/'] >> nth=0"
      - ".search-result a"
    attribute: href
    multiple: false
    required: true

  - name: Name
    selector: "h1"
    fallback_selectors:
      - "[data-product-title]"
      - ".product__title"
      - ".product-title"
    attribute: text
    multiple: false
    required: true

  - name: Description
    selector: ".x-block-description"
    fallback_selectors:
      - ".product-description"
      - "[class*='description']"
      - ".product__description"
    attribute: text
    multiple: false
    required: false

  - name: Image URLs
    selector: ".product-page img[src*='cdn/shop/']"
    fallback_selectors:
      - ".product__media img"
      - ".media img"
      - "img[src*='cdn/shop/files/']"
    attribute: src
    multiple: true
    required: true

workflows:
  - action: navigate
    name: search_page
    params:
      url: "https://bentleyseeds.com/search?q={sku}"
      wait_until: commit

  - action: wait
    name: settle_after_search
    params:
      seconds: 2

  - action: wait_for
    name: wait_for_results_or_no_results
    params:
      timeout: 10
      selector:
        - "a[href*='/products/']"
        - ".empty-state"
        - "[data-empty-state]"
        - ".no-results"
        - "main :has-text('no results found')"

  - action: check_no_results
    name: null
    params: {}

  - action: conditional_skip
    name: null
    params:
      if_flag: no_results_found

  - action: extract_single
    name: extract_product_url
    params:
      field: product_url
      selector_id: search_result_link

  - action: navigate
    name: product_page
    params:
      url: "{{product_url}}"
      wait_until: commit
      wait_after: 2

  - action: wait_for
    name: wait_for_product_details
    params:
      timeout: 10
      selector:
        - "h1"
        - ".product__title"

  - action: extract
    name: extract_fields
    params:
      fields:
        - Name
        - Description
        - Image URLs

  - action: combine_fields
    name: set_brand
    params:
      target_field: Brand
      format: "Bentley Seed"

  - action: process_images
    name: clean_images
    params:
      field: Image URLs
      quality_patterns:
        - regex: "&width=\\d+"
          replacement: ""
      filters:
        - type: require_text
          text: cdn/shop/
      deduplicate: true

anti_detection:
  enable_rate_limiting: false
  rate_limit_max_delay: 3
  rate_limit_min_delay: 1
  enable_human_simulation: false
  enable_session_rotation: false
  enable_blocking_handling: false
  enable_captcha_detection: false
  max_retries_on_detection: 3
  session_rotation_interval: 100

validation:
  no_results_selectors:
    - ".empty-state"
    - "[data-empty-state]"
    - ".no-results"
    - "main :has-text('no results found')"
  no_results_text_patterns:
    - no results found
    - "0 results"
    - couldn't find

login: null
http_status: null
normalization: null
timeout: 25
retries: 2
image_quality: 60

test_skus:
  - "051588001415"

fake_skus:
  - NOSUCHSEED999999
  - ZZZZZZNOTAREALSEED

test_assertions:
  - sku: "051588001415"
    expected:
      title: "Sunflower, Autumn Beauty Seed Packets"
      brand: "Bentley Seed"
  - sku: "NOSUCHSEED999999"
    expected:
      title: null
      brand: null

edge_case_skus:
  - "1"
  - ABCDEFGHIJ1234567890
