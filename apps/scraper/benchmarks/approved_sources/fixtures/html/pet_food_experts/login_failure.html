<!DOCTYPE html>
<html>
<head><title>Pet Food Experts - Sign In</title></head>
<body>
  <div data-test-selector="signIn_error">Invalid username or password. Please try again.</div>
  <div class="validation-summary-errors">Sign in was unsuccessful.</div>
  <form>
    <input id="userName" type="text" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button data-test-selector="signIn_submit" type="submit">Sign In</button>
  </form>
</body>
</html>
