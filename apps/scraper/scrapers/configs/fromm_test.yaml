name: "fromm_test"
display_name: "Fromm Family Foods Test"
base_url: "https://frommfamily.com"
scraper_type: "agentic"
selectors: []
workflows:
  - action: "navigate"
    params:
      url: "{{sku}}"
  - action: "wait"
    params:
      seconds: 5
  - action: "extract"
    params:
      mode: "crawl4ai"
      fields:
        - name: "images"
          selector: "img"
          attribute: "src"
          multiple: true
timeout: 60
retries: 1
use_stealth: true
