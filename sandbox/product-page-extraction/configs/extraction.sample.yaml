crawl4ai:
  page_timeout_ms: 45000
  headless: true
  screenshot: false
  remove_overlay_elements: true
  cache_mode: enabled
  verify_top_n: 10

scoring:
  accept_confidence: 0.75
  manual_review_below: 0.60
  weights:
    upc_match: 0.35
    name_token_overlap: 0.25
    brand_match: 0.15
    product_schema: 0.10
    image_presence: 0.10
    productish_url: 0.05

fallbacks:
  lmstudio_mode: "off"
  agent_browser_enabled: false
  agent_browser_when:
    - missing_images
    - low_markdown_length
    - hidden_variants
    - dynamic_content_suspected
