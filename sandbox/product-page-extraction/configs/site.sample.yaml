sites:
  fromm-example:
    brand: Fromm
    official_domains:
      - frommfamily.com
    sitemap_urls:
      - https://frommfamily.com/sitemap.xml
    discover_robots: true
    max_sitemaps: 25
    max_urls: 500
    include_url_patterns:
      - /products?
      - /product
      - /shop
      - /cat
      - /dog
    exclude_url_patterns:
      - /blog
      - /news
      - /privacy
      - /terms
      - /contact
      - /store-locator
    product_url_markers:
      - /products/
      - /product/
      - /shop/
    category_penalty_markers:
      - /category/
      - /collections/
      - /tags/
